x-runtime-image: &runtime-image
  image: daesingo-local:${DAESINGO_IMAGE_TAG:-dev}
  build:
    context: .

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: daesingo
      MYSQL_USER: daesingo
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql_password) mysql --host=127.0.0.1 --user=daesingo --database=daesingo --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *local-logging

  prepare-volumes:
    <<: *runtime-image
    user: "0:0"
    command: ["sh", "-c", "chown 10001:10001 /srv/daesingo/media"]
    volumes:
      - media_data:/srv/daesingo/media
    logging: *local-logging

  api:
    <<: *runtime-image
    init: true
    command: ["python", "-m", "daesingo.api", "--revision", "${DAESINGO_REVISION:-local}", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DAESINGO_ENV_FILE: /run/secrets/app_env
    secrets:
      - app_env
    volumes:
      - media_data:/srv/daesingo/media
    depends_on:
      mysql:
        condition: service_healthy
      prepare-volumes:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    logging: *local-logging

  worker:
    <<: *runtime-image
    init: true
    command: ["python", "-m", "daesingo.worker"]
    environment:
      DAESINGO_ENV_FILE: /run/secrets/app_env
    secrets:
      - app_env
    volumes:
      - media_data:/srv/daesingo/media
    depends_on:
      mysql:
        condition: service_healthy
      prepare-volumes:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *local-logging

secrets:
  app_env:
    file: ${DAESINGO_COMPOSE_ENV_FILE:-./deploy/local/secrets/app.env}
  mysql_password:
    file: ${DAESINGO_COMPOSE_MYSQL_PASSWORD_FILE:-./deploy/local/secrets/mysql-password}
  mysql_root_password:
    file: ${DAESINGO_COMPOSE_MYSQL_ROOT_PASSWORD_FILE:-./deploy/local/secrets/mysql-root-password}

volumes:
  mysql_data:
  media_data:
