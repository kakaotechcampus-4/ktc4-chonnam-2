[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daesingo"
version = "0.1.0"
description = "대신고 모듈형 모놀리스 백엔드"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.0,<3.0",
  "tzdata>=2023.3; sys_platform == 'win32'",
  "sqlalchemy>=2.0,<3.0",
  "pymysql[rsa]>=1.1,<2.0",  # MySQL 8.4 기본 인증(caching_sha2_password)에 rsa(cryptography) 필요
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1",
  "starlette==1.8.0",  # Existing lock; B-U1 streaming RequestBodyLimitMiddleware (>=1.6).
  "python-multipart==0.0.32",  # Streaming callbacks; bounded headers and CR/LF scanning fixes.
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
quality = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  # Checked OCR warmup imports NumPy even without the optional Paddle runtime.
  "numpy>=1.26,<3.0",
]
test = [
  "pytest>=8.0,<9.0",
  # Target-crop tests use arrays/resize with a fake OCR engine, not PaddleOCR.
  "numpy>=1.26,<3.0",
  "opencv-contrib-python==4.10.0.84",
  "httpx>=0.27,<1",
]
eval-gemini = [
  "anyio>=4.0,<5.0",
  "openai>=1.40,<3.0",
]
readout-paddle = [
  "opencv-contrib-python==4.10.0.84",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
]
eval-yolo = [
  "ultralytics==8.4.133",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"daesingo.search" = ["prompt_resources/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "mysql: requires a real MySQL 8.4 server (CI: no skips or xfails)",
  "mysql_scenario(name): required RT-02(a) MySQL acceptance evidence",
  "mysql_check(role, scenario, parameter=None): required role/scenario and optional stable parameter execution evidence",
]

# RT-15(a): paths are enumerated by scripts/check_runtime_quality.py.
[tool.ruff]
target-version = "py312"
required-version = "==0.17.3"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src/daesingo/common", "src/daesingo/api", "src/daesingo/worker", "migrations/runtime"]
# Analyze imported public types, without imposing diagnostics on other Owners.
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[[tool.mypy.overrides]]
# Production OCR is optional and dynamically loaded; its startup/preflight and
# actual invocation acceptance remain runtime checks, not fabricated stubs.
module = "paddleocr"
ignore_missing_imports = true
