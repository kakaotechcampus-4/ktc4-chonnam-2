name: python-tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install locked root dependencies (no PaddleOCR)
        run: uv sync --locked --extra test --extra eval-gemini
      - name: Verify complete and disjoint pytest collection partitions
        run: uv run --no-sync python -m tests.ci_orchestration collect "$RUNNER_TEMP/collection"
      - name: Install and inspect media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg fonts-nanum
          ffmpeg -version
          ffprobe -version
          uv run --no-sync python --version
          ffmpeg -hide_banner -h full > "$RUNNER_TEMP/ffmpeg-help.txt"
          grep -q -- '-fps_mode' "$RUNNER_TEMP/ffmpeg-help.txt"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q 'libx264' "$RUNNER_TEMP/ffmpeg-encoders.txt"
      - name: Recording synthetic media smoke (must execute)
        run: |
          uv run --no-sync python -m pytest tests/recording/test_ci_media_smoke.py -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/recording-smoke.xml"
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree
          root = ElementTree.parse(Path(os.environ['RUNNER_TEMP']) / 'recording-smoke.xml')
          cases = root.findall('.//testcase')
          assert len(cases) == 1, 'Expected exactly one Recording media smoke'
          assert all(c.find(tag) is None for c in cases for tag in ('skipped', 'failure', 'error')), 'Media smoke must pass without skips'
          PY
      - name: Pinned deployment image media and OCR acceptance (must execute)
        run: |
          docker build --tag daesingo-deployment-media:ci .
          cleanup() {
            result=$?
            trap - EXIT
            docker rm --force --volumes daesingo-issue468-mysql >/dev/null 2>&1 || result=1
            docker network rm daesingo-issue468-acceptance >/dev/null 2>&1 || result=1
            docker image rm daesingo-deployment-media:ci || result=1
            exit "$result"
          }
          trap cleanup EXIT
          docker run --rm --network none daesingo-deployment-media:ci python /app/docker/runtime.py media-preflight
          docker run --rm --network none \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/deploy/media_acceptance.py",target=/opt/media-acceptance.py,readonly \
            daesingo-deployment-media:ci python /opt/media-acceptance.py
          docker run --rm --network none daesingo-deployment-media:ci python /app/docker/runtime.py readout-preflight
          docker run --rm --network none \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/deploy/readout_acceptance.py",target=/opt/readout-acceptance.py,readonly \
            --mount type=bind,source=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf,target=/opt/acceptance-font.ttf,readonly \
            daesingo-deployment-media:ci python /opt/readout-acceptance.py /opt/acceptance-font.ttf
          for problem in dependency cache permission; do
            docker run --rm --network none --user 0:0 \
              --mount type=bind,source="$GITHUB_WORKSPACE/tests/deploy/readout_startup_acceptance.py",target=/opt/readout-startup-acceptance.py,readonly \
              daesingo-deployment-media:ci python /opt/readout-startup-acceptance.py "$problem"
          done
          docker network create --internal daesingo-issue468-acceptance
          docker run --detach --name daesingo-issue468-mysql --network daesingo-issue468-acceptance \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes -e MYSQL_ROOT_HOST=% -e MYSQL_DATABASE=daesingo_test mysql:8.4
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec daesingo-issue468-mysql mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --network daesingo-issue468-acceptance \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/deploy/readout_process_acceptance.py",target=/opt/readout-process-acceptance.py,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/deploy/readout_acceptance.py",target=/opt/readout_acceptance.py,readonly \
            --mount type=bind,source="$GITHUB_WORKSPACE/tests/e2e_runtime/production_processes.py",target=/opt/production_processes.py,readonly \
            --mount type=bind,source=/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf,target=/opt/acceptance-font.ttf,readonly \
            daesingo-deployment-media:ci python /opt/readout-process-acceptance.py /opt/acceptance-font.ttf
      - name: Non-MySQL regression
        run: uv run --no-sync python -m tests.ci_orchestration regression "$RUNNER_TEMP/regression.xml"

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql-ci-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: daesingo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysql-ci-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      DAESINGO_MYSQL_URL: mysql+pymysql://root:mysql-ci-only@127.0.0.1:3306/daesingo_test
      DAESINGO_REQUIRE_MYSQL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.15"
          enable-cache: false
      - name: Install locked root dependencies (no PaddleOCR)
        run: uv sync --locked --extra test --extra eval-gemini
      - name: Install and inspect media tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
          uv run --no-sync python --version
          ffmpeg -hide_banner -h full > "$RUNNER_TEMP/ffmpeg-help.txt"
          grep -q -- '-fps_mode' "$RUNNER_TEMP/ffmpeg-help.txt"
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/ffmpeg-encoders.txt"
          grep -q 'libx264' "$RUNNER_TEMP/ffmpeg-encoders.txt"
      - name: Canonical MySQL once, strict JSON/JUnit and actual-report mutations
        run: uv run --no-sync python -m tests.ci_orchestration mysql "$RUNNER_TEMP/mysql-evidence"

  # Keep the original check name. A skipped/cancelled/failed dependency must
  # never be turned into a successful required result by GitHub's skip rules.
  test:
    if: ${{ always() }}
    needs: [regression, mysql]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require every execution job to succeed
        env:
          CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: python -m tests.ci_orchestration required
