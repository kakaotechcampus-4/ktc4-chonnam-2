name: pre-deploy-secret-scan

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      target_revision:
        type: string
        required: false
        default: ""
      require_target:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Reject untrusted execution context before checkout
        if: github.repository != 'kakaotechcampus-4/ktc4-chonnam-2' || github.repository_id != '1340154683' || github.ref != 'refs/heads/develop' || github.event_name != 'workflow_dispatch'
        run: exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and verify pinned offline scanner
        run: python scripts/check_secrets.py install --tool-dir "$RUNNER_TEMP/rt15c-tool"
      - name: Mandatory synthetic detection, non-disclosure and failure controls
        run: python scripts/secret_scan_controls.py --tool-dir "$RUNNER_TEMP/rt15c-tool"
      - name: Current Git files and complete HEAD ancestry (counts only)
        env:
          REQUIRE_TARGET: ${{ inputs.require_target }}
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          if [ "$REQUIRE_TARGET" = "true" ]; then
            python scripts/check_secrets.py scan --repo . --tool-dir "$RUNNER_TEMP/rt15c-tool" --require-ancestor "$TARGET_REVISION"
          else
            python scripts/check_secrets.py scan --repo . --tool-dir "$RUNNER_TEMP/rt15c-tool"
          fi
