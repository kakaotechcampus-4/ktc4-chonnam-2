# 모듈 경계 · 계약 정합성 점검
#
# 팀 자체 워크플로다. 운영진 소유 4개 파일(assign-mentor · notify-discord ·
# convention-check · CODEOWNERS)은 건드리지 않는다.
#
# 점검 명세는 이 파일이 아니라 아래 두 문서가 소유한다.
#   docs/management/ownership.md §6
#   docs/architecture/module-architecture.md §5-1 · §3-5
name: boundary-check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 모듈 경계 · 계약 정합성
        run: python scripts/check_boundaries.py
