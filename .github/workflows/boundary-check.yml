# 모듈 경계 · 계약 정합성 점검
#
# 팀 자체 워크플로다. 운영진 소유 4개 파일(assign-mentor · notify-discord ·
# convention-check · CODEOWNERS)은 건드리지 않는다.
#
# 점검 명세는 이 파일이 아니라 아래 문서들이 소유한다.
#   docs/management/ownership.md §6
#   docs/architecture/module-architecture.md §5-1 · §3-5
#   docs/architecture/contracts/adr/adr-data-contract-call-closure-2026-09-08.md §7
name: boundary-check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # 이 PR에서만 Python 3.12 기준 lock을 재생성하고 head branch에 반영한다.
      # lock 반영 확인 뒤 최종 워크플로에서는 제거한다.
      - name: Python 3.12 lock 재생성
        run: uv lock

      - name: 변경된 lock 반영
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(env): regenerate uv lock for Python 3.12"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Python 3.12 환경 동기화
        run: uv sync --locked

      - name: 전체 pytest
        run: uv run pytest

      - name: 모듈 경계 · 계약 정합성
        run: uv run python scripts/check_boundaries.py

      - name: 계약 예시 · fixture 의미 검사
        run: uv run python scripts/check_contract_fixtures.py

      - name: Mock Pack 검증
        run: uv run python data/mock/validate_mock_pack.py
