# 모듈 경계 · 계약 정합성 점검
#
# 팀 자체 워크플로다. 운영진 소유 4개 파일(assign-mentor · notify-discord ·
# convention-check · CODEOWNERS)은 건드리지 않는다.
#
# 점검 명세는 이 파일이 아니라 아래 문서들이 소유한다.
#   docs/management/ownership.md §6
#   docs/architecture/module-architecture.md §5-1 · §3-5
#   docs/architecture/contracts/adr/adr-data-contract-call-closure-2026-09-08.md §7
name: boundary-check

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # Python 3.12 기준 lock을 이번 PR에서 재생성해 커밋하기 위한 임시 검증 단계.
      # 최종 PR에서는 uv sync --locked로 교체한다.
      - name: Python 3.12 lock 재생성
        run: uv lock

      - name: 생성된 lock artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: generated-uv-lock
          path: uv.lock

      - name: 모듈 경계 · 계약 정합성
        run: uv run python scripts/check_boundaries.py

      - name: 계약 예시 · fixture 의미 검사
        run: uv run python scripts/check_contract_fixtures.py
